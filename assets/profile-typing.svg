<svg xmlns="http://www.w3.org/2000/svg" width="900" height="96" viewBox="0 0 900 96" role="img" aria-label="Áreas de atuação e estudo de Matheus Amaro">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .prompt { fill: #39ff14; font-size: 19px; font-weight: 700; }
    .line { fill: #58a6ff; font-size: 19px; font-weight: 600; }
    .cursor { fill: #39ff14; }
  </style>

  <text x="18" y="34" class="prompt">matheus@amaro:~$</text>

  <text x="220" y="34" class="line" opacity="0">Linux • Automação • Infraestrutura Crítica
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="220" y="34" class="line" opacity="0">Desenvolvimento de Software • Git • JavaScript
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.47;0.50;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="220" y="34" class="line" opacity="0">Redes • Virtualização • Monitoramento
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.53;0.72;0.75;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="220" y="34" class="line" opacity="0">ADS • Engenharia de Software • Aprendizado Contínuo
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.78;0.97;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <rect x="220" y="49" width="11" height="21" rx="1" class="cursor">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <text x="18" y="75" fill="#8b949e" font-size="14">Infraestrutura real + desenvolvimento de soluções confiáveis, seguras e documentadas.</text>
</svg>
